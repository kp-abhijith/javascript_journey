<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async js</title>
</head>
<body>
    <h1>chai aur code</h1>
    <button id="stop">stop</button>
</body>
<script>
    const say=function(){
        console.log("hii !! Abhijith")
        
    }
    const change =function(){
        document.querySelector("h1").innerHTML=" kp is best"
    }
    const time=setTimeout(change,3000)
    setTimeout(say,2000)
    // clearTimeout(change)
    document.querySelector("#stop").addEventListener("click",function(){
        clearTimeout(time)
        console.log("stopped");
        
    })
</script>
</html>
